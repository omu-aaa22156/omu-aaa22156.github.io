    <h2>おすすめの食べ物：きつねうどん</h2>
    <p>きつねうどんは、うどんに甘く煮た油揚げを合わせた料理です。だしを含んだ油揚げと、あたたかいうどんを一緒に味わえるところがおすすめです。</p>
    <h3>楽しみ方</h3>
    <ul>
      <li>まずは、だしと麺をそのまま味わう。</li>
      <li>油揚げとねぎを麺に合わせて食べる。</li>
      <li>好みに合わせて七味などを少し加える。</li>
    </ul>
