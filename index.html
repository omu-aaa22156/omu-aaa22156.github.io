<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おすすめの食べ物 小林拓磨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Webシステム構築基礎 第3回課題</h1>
    <p>小林拓磨（AAA22156）</p>
  </header>

  <section class="exercise" aria-label="動く時計">
    <h2>現在時刻</h2>
    <div id="clock" aria-live="off"></div>
    <p class="note">この端末の現在時刻を、1秒ごとに更新します。</p>
  </section>
  <script>
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var seconds = now.getSeconds();

      if (hours < 10) hours = '0' + hours;
      if (minutes < 10) minutes = '0' + minutes;
      if (seconds < 10) seconds = '0' + seconds;

      document.getElementById('clock').textContent =
        hours + ':' + minutes + ':' + seconds;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <main>
    <h2>おすすめの食べ物 きつねうどん</h2>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Kitsune_Udon.jpg"
           alt="きざんだ油揚げとねぎがのった京風きつねうどん"
           width="612" height="459" referrerpolicy="no-referrer">
      <figcaption>写真：Kykk wiki / Wikimedia Commons / CC0
        <a href="https://commons.wikimedia.org/wiki/File:Kitsune_Udon.jpg" referrerpolicy="no-referrer">画像の掲載元</a>
      </figcaption>
    </figure>
    <p>きつねうどんは、うどんに油揚げを合わせた料理です。だしと油揚げの組み合わせを楽しめるところがおすすめです。</p>
    <h3>楽しみ方</h3>
    <ul>
      <li>まずは、だしと麺をそのまま味わう。</li>
      <li>油揚げとねぎを麺に合わせて食べる。</li>
      <li>好みに合わせて七味などを少し加える。</li>
    </ul>
    <nav><a href="second.html">おすすめの旅行先 京都を見る</a></nav>
  </main>
</body>
</html>
