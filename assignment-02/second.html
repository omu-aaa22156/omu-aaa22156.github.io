    <h3>清水寺の周辺を歩く</h3>
    <p>清水寺の見学と周辺の散策を組み合わせ、景色や町並みを楽しむコースです。途中で休憩を入れると、無理なく歩けます。</p>
    <h3>食事も一緒に楽しむ</h3>
